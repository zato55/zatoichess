<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZATO CHESS — Premium Online Satranç</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#08090c;
  --bg-2:#0c0e12;
  --panel:#101318;
  --panel-2:#151922;
  --panel-3:#1b2029;
  --line:#1e232c;
  --line-2:#2a313c;
  --txt:#e8ebf0;
  --txt-2:#98a1af;
  --txt-3:#616a78;
  --accent:#7b8cff;
  --accent-hi:#95a3ff;
  --accent-dim:rgba(123,140,255,.13);
  --gold:#d8b45c;
  --silver:#b6c0ce;
  --bronze:#c08457;
  --green:#43c08a;
  --red:#e0576a;
  --blue:#54a8e8;
  --r-lg:16px;
  --r:12px;
  --r-sm:9px;
  --shadow:0 1px 0 rgba(255,255,255,.025) inset, 0 12px 32px -20px rgba(0,0,0,.9);
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 620px at 18% -12%, rgba(123,140,255,.06), transparent 62%),
    radial-gradient(900px 520px at 102% -4%, rgba(123,140,255,.032), transparent 58%),
    var(--bg);
  color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{display:block}
::selection{background:rgba(123,140,255,.3)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#232a34;border-radius:9px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#333d4a;background-clip:padding-box;border:3px solid transparent}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{
  display:grid;
  grid-template-columns:252px minmax(0,1fr) 322px;
  height:100dvh;
}
.sidebar{
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,#0b0d11 0%,#08090c 100%);
  display:flex;flex-direction:column;
  padding:18px 14px 14px;
  min-height:0;
}
.main{
  overflow-y:auto;
  overflow-x:hidden;
  padding:26px 30px 56px;
  min-height:0;
  scroll-behavior:smooth;
}
.rail{
  border-left:1px solid var(--line);
  background:linear-gradient(180deg,#0b0d11 0%,#08090c 100%);
  overflow-y:auto;
  padding:22px 18px 48px;
  min-height:0;
}
.mobile-nav{display:none}

/* ============================================================
   SIDEBAR
   ============================================================ */
.brand{
  display:flex;align-items:center;gap:11px;
  padding:2px 6px 20px;
}
.brand-mark{
  width:36px;height:36px;border-radius:11px;
  display:grid;place-items:center;
  background:linear-gradient(150deg,#1a2030,#0e1117);
  border:1px solid var(--line-2);
  box-shadow:0 0 0 1px rgba(123,140,255,.07), 0 6px 18px -10px rgba(0,0,0,.9);
  flex-shrink:0;
}
.brand-mark svg{width:21px;height:21px}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text strong{font-size:15px;font-weight:800;letter-spacing:.14em}
.brand-text span{font-size:9.5px;font-weight:700;letter-spacing:.36em;color:var(--accent);margin-top:3px}

.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto}
.nav-label{
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-3);padding:14px 12px 7px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:10px;
  color:var(--txt-2);font-weight:550;font-size:13.5px;
  cursor:pointer;position:relative;
  transition:background .16s,color .16s;
  text-align:left;width:100%;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:var(--panel-2);color:var(--txt)}
.nav-item.active{background:var(--panel-3);color:var(--txt)}
.nav-item.active svg{opacity:1;color:var(--accent)}
.nav-item.active::before{
  content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:17px;border-radius:0 3px 3px 0;background:var(--accent);
}
.nav-badge{
  margin-left:auto;font-size:10.5px;font-weight:700;font-family:var(--mono);
  background:var(--accent-dim);color:var(--accent);
  padding:1px 6px;border-radius:6px;line-height:1.5;
}

.sidebar-user{
  margin-top:12px;padding:10px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;gap:10px;cursor:pointer;
  transition:border-color .16s,background .16s;
}
.sidebar-user:hover{border-color:var(--line-2);background:var(--panel-2)}
.su-info{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.35}
.su-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-elo{font-size:11px;color:var(--txt-3);font-family:var(--mono)}

/* ============================================================
   AVATARS
   ============================================================ */
.avatar{
  border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  font-weight:700;color:#eef1f6;letter-spacing:.02em;
  background:linear-gradient(150deg,hsl(var(--h) 34% 30%),hsl(var(--h) 40% 15%));
  border:1px solid rgba(255,255,255,.075);
  box-shadow:0 4px 12px -8px rgba(0,0,0,.9);
}
.avatar.s{width:34px;height:34px;font-size:12px;border-radius:10px}
.avatar.m{width:42px;height:42px;font-size:14px}
.avatar.l{width:76px;height:76px;font-size:26px;border-radius:20px}
.avatar.xl{width:104px;height:104px;font-size:36px;border-radius:26px}

/* ============================================================
   COMMON
   ============================================================ */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
}
.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  margin-bottom:22px;flex-wrap:wrap;
}
.page-title{font-size:23px;font-weight:750;letter-spacing:-.025em}
.page-sub{font-size:13px;color:var(--txt-3);margin-top:3px}
.page-sub strong{color:var(--txt-2);font-weight:600}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}

.sec-title{
  font-size:10.5px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;
  color:var(--txt-3);
}
.sec-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:36px;padding:0 14px;border-radius:10px;
  font-size:13px;font-weight:600;letter-spacing:.005em;
  border:1px solid transparent;color:var(--txt);
  cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s,transform .08s,box-shadow .15s;
}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{
  background:var(--accent);color:#0a0c12;font-weight:700;
  box-shadow:0 6px 20px -12px rgba(123,140,255,.9);
}
.btn-primary:hover{background:var(--accent-hi)}
.btn-ghost{background:var(--panel-2);border-color:var(--line);color:var(--txt-2)}
.btn-ghost:hover{background:var(--panel-3);color:var(--txt);border-color:var(--line-2)}
.btn-danger{background:transparent;border-color:rgba(224,87,106,.3);color:var(--red)}
.btn-danger:hover{background:rgba(224,87,106,.1);border-color:rgba(224,87,106,.5)}
.btn-lg{height:44px;padding:0 20px;font-size:14px;border-radius:12px}
.btn-sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn-sm svg{width:13px;height:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}

.icon-btn{
  width:32px;height:32px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--txt-3);border:1px solid transparent;
  transition:background .15s,color .15s,border-color .15s;
}
.icon-btn svg{width:15px;height:15px}
.icon-btn:hover{background:var(--panel-3);color:var(--txt);border-color:var(--line)}
.icon-btn.sm{width:26px;height:26px;border-radius:7px}
.icon-btn.sm svg{width:13px;height:13px}

/* Pills / badges */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;border-radius:7px;
  background:var(--panel-3);color:var(--txt-2);border:1px solid var(--line);
}
.pill.accent{background:var(--accent-dim);color:var(--accent);border-color:rgba(123,140,255,.22)}
.pill.gold{background:rgba(216,180,92,.12);color:var(--gold);border-color:rgba(216,180,92,.22)}
.pill.green{background:rgba(67,192,138,.12);color:var(--green);border-color:rgba(67,192,138,.22)}
.pill.red{background:rgba(224,87,106,.12);color:var(--red);border-color:rgba(224,87,106,.22)}
.pill.muted{background:transparent;color:var(--txt-3);border-color:var(--line)}

.rank-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:650;color:var(--txt-2);
}
.rank-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 0 rgba(224,87,106,.6);
  animation:pulse 2s infinite;flex-shrink:0;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(224,87,106,.55)}
  70%{box-shadow:0 0 0 7px rgba(224,87,106,0)}
  100%{box-shadow:0 0 0 0 rgba(224,87,106,0)}
}

/* ============================================================
   RAIL PANELS
   ============================================================ */
.rail-stack{display:flex;flex-direction:column;gap:16px}
.rail-panel{padding:15px 15px 13px}
.rail-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.rail-head h3{font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.rail-head .link{font-size:11px;color:var(--txt-3);cursor:pointer;transition:color .15s}
.rail-head .link:hover{color:var(--accent)}

.mini-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 6px;border-radius:9px;cursor:pointer;
  transition:background .15s;
}
.mini-row:hover{background:var(--panel-2)}
.mini-row .mr-body{flex:1;min-width:0}
.mr-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-meta{font-size:11px;color:var(--txt-3);display:flex;gap:7px;align-items:center;margin-top:1px}
.mr-val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--txt-2)}

.live-item{
  padding:9px 8px;border-radius:10px;cursor:pointer;
  transition:background .15s;border:1px solid transparent;
}
.live-item:hover{background:var(--panel-2);border-color:var(--line)}
.li-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.li-players{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;min-width:0}
.li-players .vs{color:var(--txt-3);font-size:10px;font-weight:500}
.li-players span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-meta{display:flex;gap:8px;font-size:10.5px;color:var(--txt-3);padding-left:14px}
.li-meta b{color:var(--txt-2);font-weight:600}

/* ============================================================
   HOME
   ============================================================ */
.hero{
  position:relative;overflow:hidden;
  padding:26px 28px;
  display:flex;align-items:center;gap:28px;flex-wrap:wrap;
  background:
    radial-gradient(600px 200px at 8% 0%, rgba(123,140,255,.09), transparent 70%),
    linear-gradient(160deg,#12161e 0%,#0d1015 100%);
}
.hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(520px 260px at 88% 50%,#000,transparent 72%);
  -webkit-mask-image:radial-gradient(520px 260px at 88% 50%,#000,transparent 72%);
}
.hero-left{flex:1;min-width:280px;position:relative;z-index:1}
.hero-left h2{
  font-size:26px;font-weight:780;letter-spacing:-.03em;line-height:1.15;margin:14px 0 8px;
}
.hero-left p{color:var(--txt-2);font-size:13.5px;max-width:430px;line-height:1.6}
.hero-cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero-right{
  position:relative;z-index:1;display:flex;gap:26px;align-items:center;
  padding-left:28px;border-left:1px solid var(--line);
}
.hero-elo{display:flex;flex-direction:column;gap:2px}
.hero-elo .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--txt-3)}
.hero-elo .val{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
.hero-elo .delta{font-size:11.5px;font-weight:600;color:var(--green)}
.hero-prog{width:180px}
.hero-prog .bar{height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden;margin:8px 0 6px}
.hero-prog .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#a6b2ff)}
.hero-prog .txt{font-size:11px;color:var(--txt-3);display:flex;justify-content:space-between}

.stat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-top:16px;
}
.stat{padding:14px 16px 13px;display:flex;flex-direction:column;gap:3px}
.stat .lbl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-3)}
.stat .val{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.stat .sub{font-size:11px;color:var(--txt-3)}
.stat .sub.up{color:var(--green)}
.stat .sub.down{color:var(--red)}

.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:1180px){.cols-2{grid-template-columns:1fr}}

/* Time control chips */
.tc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tc{
  padding:12px 8px;border-radius:11px;text-align:center;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line);
  transition:border-color .16s,background .16s,transform .1s;
}
.tc:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tc.active{border-color:rgba(123,140,255,.5);background:var(--accent-dim)}
.tc .t{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.03em}
.tc .s{font-size:10px;color:var(--txt-3);margin-top:2px;font-weight:600}
.tc.active .t{color:var(--accent)}

/* ============================================================
   BOARD
   ============================================================ */
.board-shell{width:100%;max-width:min(64vh,600px);margin:0 auto;position:relative}
.board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  aspect-ratio:1/1;
  width:100%;
  border-radius:10px;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.07),
    0 0 0 7px #0e1116,
    0 0 0 8px rgba(255,255,255,.04),
    0 34px 70px -30px rgba(0,0,0,.95);
  user-select:none;
}
.sq{
  position:relative;display:flex;align-items:center;justify-content:center;
  cursor:default;
}
.sq.light{background:#d8dce3}
.sq.dark{background:#545c6d}
.sq.last{box-shadow:inset 0 0 0 999px rgba(123,140,255,.19)}
.sq.sel{box-shadow:inset 0 0 0 999px rgba(123,140,255,.36)}
.sq.check{box-shadow:inset 0 0 0 999px rgba(224,87,106,.45)}
.sq.clickable{cursor:pointer}
.sq.hover-target{box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}

.coord{
  position:absolute;font-size:9px;font-weight:700;
  font-family:var(--mono);pointer-events:none;opacity:.62;
}
.coord.rank{top:2px;left:4px}
.coord.file{bottom:1px;right:4px}
.sq.light .coord{color:#4a5261}
.sq.dark .coord{color:#ccd3dd}

.piece{
  width:84%;height:84%;position:relative;z-index:2;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));
  pointer-events:none;
}
.piece.w{fill:#f3f5f8;stroke:#22272f;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.piece.b{fill:#14181e;stroke:#9aa5b4;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}

.dot{
  position:absolute;width:26%;height:26%;border-radius:50%;
  background:rgba(12,15,20,.34);z-index:1;pointer-events:none;
}
.dot.cap{
  width:100%;height:100%;border-radius:0;background:transparent;
  box-shadow:inset 0 0 0 6px rgba(12,15,20,.28);
}
.sq.sel .dot{background:rgba(12,15,20,.4)}

/* Player strip */
.pstrip{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);
  transition:border-color .2s,background .2s;
}
.pstrip.turn{border-color:rgba(123,140,255,.4);background:var(--panel-2)}
.ps-body{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.ps-name{font-size:13px;font-weight:650;display:flex;align-items:center;gap:7px}
.ps-meta{font-size:11px;color:var(--txt-3);display:flex;align-items:center;gap:8px}
.ps-elo{font-family:var(--mono);font-weight:600;color:var(--txt-2)}

.clock{
  font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.03em;
  padding:5px 12px;border-radius:9px;
  background:var(--panel-3);border:1px solid var(--line);
  color:var(--txt-2);transition:all .2s;min-width:88px;text-align:center;
}
.clock.active{background:var(--accent-dim);border-color:rgba(123,140,255,.4);color:var(--txt)}
.clock.low{color:var(--red);border-color:rgba(224,87,106,.4);background:rgba(224,87,106,.08)}
.clock.active.low{animation:clockPulse 1s infinite}
@keyframes clockPulse{50%{opacity:.55}}

/* ============================================================
   PLAY LAYOUT
   ============================================================ */
.play-layout{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:22px;align-items:start}
@media(max-width:1080px){.play-layout{grid-template-columns:1fr}}

.play-main{display:flex;flex-direction:column;gap:11px}
.play-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}

.mode-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px;border-radius:13px;background:var(--panel);border:1px solid var(--line);
  margin-bottom:16px;
}
.mode-chip{
  padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;
  color:var(--txt-3);cursor:pointer;transition:all .16s;
  display:flex;align-items:center;gap:7px;white-space:nowrap;
}
.mode-chip svg{width:14px;height:14px}
.mode-chip:hover{color:var(--txt);background:var(--panel-2)}
.mode-chip.active{background:var(--accent-dim);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(123,140,255,.25)}
.mode-bar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.tc-inline{display:flex;gap:5px}
.tc-mini{
  padding:6px 11px;border-radius:8px;font-family:var(--mono);font-size:12px;font-weight:700;
  color:var(--txt-3);cursor:pointer;transition:all .16s;border:1px solid transparent;
}
.tc-mini:hover{color:var(--txt);background:var(--panel-2)}
.tc-mini.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(123,140,255,.25)}

.action-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:2px;
}

/* Move list */
.movelist{
  max-height:330px;overflow-y:auto;
  padding-right:4px;margin:-4px -4px -4px 0;
}
.mv-row{
  display:grid;grid-template-columns:30px 1fr 1fr;
  align-items:center;border-radius:8px;
  font-size:12.5px;font-family:var(--mono);font-weight:600;
}
.mv-row:nth-child(odd){background:rgba(255,255,255,.012)}
.mv-row .mn{color:var(--txt-3);font-size:11px;text-align:center;padding:6px 0}
.mv-cell{
  padding:6px 9px;border-radius:7px;cursor:pointer;color:var(--txt-2);
  transition:background .14s,color .14s;
}
.mv-cell:hover{background:var(--panel-3);color:var(--txt)}
.mv-cell.cur{background:var(--accent-dim);color:var(--accent)}
.mv-cell.empty{cursor:default;color:var(--txt-3);opacity:.4}
.mv-cell.empty:hover{background:none}

/* Game info rows */
.info-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.035);
}
.info-row:last-child{border-bottom:0}
.info-row .k{color:var(--txt-3)}
.info-row .v{font-weight:600;color:var(--txt-2);display:flex;align-items:center;gap:7px}
.info-row .v.mono{font-family:var(--mono)}

.conn{
  display:flex;align-items:center;gap:8px;font-size:11.5px;
  color:var(--txt-3);padding:2px 0;
}
.conn .bar{display:flex;gap:2px;align-items:flex-end}
.conn .bar i{width:3px;background:var(--green);border-radius:1px}
.conn .bar i:nth-child(1){height:4px}
.conn .bar i:nth-child(2){height:7px}
.conn .bar i:nth-child(3){height:10px}
.conn .bar i:nth-child(4){height:13px;background:var(--panel-3)}

/* ============================================================
   LEADERBOARD
   ============================================================ */
.podium{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;
}
.podium-card{
  padding:16px;border-radius:var(--r-lg);position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  transition:transform .18s,border-color .18s;
}
.podium-card:hover{transform:translateY(-2px)}
.podium-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
}
.podium-card.p1::before{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.podium-card.p2::before{background:linear-gradient(90deg,transparent,var(--silver),transparent)}
.podium-card.p3::before{background:linear-gradient(90deg,transparent,var(--bronze),transparent)}
.podium-card.p1{background:radial-gradient(300px 120px at 50% 0%,rgba(216,180,92,.07),transparent 70%),var(--panel)}
.podium-rank{
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;
}
.podium-card.p1 .podium-rank{color:var(--gold)}
.podium-card.p2 .podium-rank{color:var(--silver)}
.podium-card.p3 .podium-rank{color:var(--bronze)}
.podium-name{font-size:13.5px;font-weight:680;margin-top:1px}
.podium-elo{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.03em}

.lb-table{width:100%;border-collapse:collapse}
.lb-table th{
  text-align:left;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--txt-3);padding:0 12px 10px;border-bottom:1px solid var(--line);
}
.lb-table th:last-child,.lb-table td:last-child{text-align:right}
.lb-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.035);font-size:13px}
.lb-table tr:last-child td{border-bottom:0}
.lb-table tbody tr{transition:background .14s}
.lb-table tbody tr:hover{background:var(--panel-2)}
.lb-table tr.me{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent)}
.lb-table tr.me:hover{background:rgba(123,140,255,.18)}
.lb-pos{font-family:var(--mono);font-weight:700;color:var(--txt-3);width:44px}
.lb-player{display:flex;align-items:center;gap:11px}
.lb-player .nm{font-weight:620}
.lb-elo{font-family:var(--mono);font-weight:700}

/* ============================================================
   TOURNAMENTS
   ============================================================ */
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.t-card{
  padding:16px;display:flex;flex-direction:column;gap:13px;
  transition:border-color .18s,transform .18s;cursor:pointer;
}
.t-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.t-card.live{border-color:rgba(224,87,106,.28)}
.t-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.t-name{font-size:14.5px;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.t-sub{font-size:11.5px;color:var(--txt-3);margin-top:3px}
.t-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.t-meta-item .k{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--txt-3)}
.t-meta-item .v{font-size:12.5px;font-weight:620;margin-top:2px;font-family:var(--mono)}
.t-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:12px;border-top:1px solid var(--line);
}
.t-players{display:flex;align-items:center;gap:-6px}
.t-players .avatar{margin-right:-9px;border:2px solid var(--panel)}
.t-players .more{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--panel-3);border:1px solid var(--line);
  font-size:10.5px;font-weight:700;color:var(--txt-2);font-family:var(--mono);
  margin-left:0;position:relative;z-index:1;
}

/* Bracket */
.bracket{display:flex;gap:26px;overflow-x:auto;padding:6px 2px 14px}
.bracket-round{display:flex;flex-direction:column;gap:14px;min-width:190px;justify-content:space-around}
.br-label{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--txt-3);text-align:center;
}
.br-match{
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;
}
.br-side{
  display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.br-side:last-child{border-bottom:0}
.br-side .sc{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:11.5px;color:var(--txt-3)}
.br-side.win{background:rgba(123,140,255,.07)}
.br-side.win .nm{font-weight:680}
.br-side.win .sc{color:var(--accent)}

/* ============================================================
   HISTORY
   ============================================================ */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600;
  color:var(--txt-3);background:var(--panel);border:1px solid var(--line);
  cursor:pointer;transition:all .16s;
}
.chip:hover{color:var(--txt);border-color:var(--line-2)}
.chip.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(123,140,255,.3)}

.hist-list{display:flex;flex-direction:column}
.hist-row{
  display:grid;grid-template-columns:4px 42px minmax(0,1fr) auto;
  gap:14px;align-items:center;
  padding:13px 16px;border-bottom:1px solid var(--line);
  transition:background .15s;
}
.hist-row:last-child{border-bottom:0}
.hist-row:hover{background:var(--panel-2)}
.hist-bar{width:3px;height:30px;border-radius:2px;background:var(--green)}
.hist-bar.loss{background:var(--red)}
.hist-bar.draw{background:var(--txt-3)}
.hist-bar.void{background:repeating-linear-gradient(45deg,var(--txt-3),var(--txt-3) 3px,transparent 3px,transparent 6px)}
.hist-main{min-width:0}
.hist-opp{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hist-reason{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.hist-side{
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;
}
.hist-elo{font-family:var(--mono);font-size:13px;font-weight:700}
.hist-elo.up{color:var(--green)}
.hist-elo.down{color:var(--red)}
.hist-elo.none{color:var(--txt-3)}
.hist-date{font-size:11px;color:var(--txt-3);font-family:var(--mono)}
.hist-color{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  display:flex;align-items:center;gap:5px;color:var(--txt-3);
}
.color-dot{width:9px;height:9px;border-radius:3px;border:1px solid var(--line-2)}
.color-dot.w{background:#e8ebf0}
.color-dot.b{background:#1b2029}

/* ============================================================
   PROFILE
   ============================================================ */
.prof-head{
  padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
  background:radial-gradient(600px 200px at 0% 0%,rgba(123,140,255,.07),transparent 65%),var(--panel);
}
.prof-id{flex:1;min-width:220px}
.prof-name{
  font-size:24px;font-weight:780;letter-spacing:-.03em;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.prof-tags{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.prof-elo-box{
  display:flex;gap:26px;padding-left:24px;border-left:1px solid var(--line);
}
@media(max-width:640px){
  .prof-elo-box{padding-left:0;border-left:0;border-top:1px solid var(--line);padding-top:16px;width:100%}
}
.prof-elo-item .k{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-3)}
.prof-elo-item .v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.035em;margin-top:2px}
.prof-elo-item .v.sm{font-size:16px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px}
.tab{
  padding:10px 15px;font-size:13px;font-weight:620;color:var(--txt-3);
  cursor:pointer;position:relative;transition:color .16s;
}
.tab:hover{color:var(--txt-2)}
.tab.active{color:var(--txt)}
.tab.active::after{
  content:'';position:absolute;bottom:-1px;left:12px;right:12px;height:2px;
  background:var(--accent);border-radius:2px;
}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ach{
  padding:14px;display:flex;gap:12px;align-items:center;
  border-radius:14px;background:var(--panel);border:1px solid var(--line);
  transition:border-color .16s;
}
.ach:hover{border-color:var(--line-2)}
.ach.locked{opacity:.45}
.ach-icon{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:var(--panel-3);border:1px solid var(--line-2);
}
.ach-icon svg{width:19px;height:19px}
.ach-body{min-width:0}
.ach-name{font-size:12.5px;font-weight:650}
.ach-desc{font-size:11px;color:var(--txt-3);margin-top:1px}

/* ============================================================
   FRIENDS
   ============================================================ */
.friend-row{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-bottom:1px solid var(--line);transition:background .15s;
}
.friend-row:last-child{border-bottom:0}
.friend-row:hover{background:var(--panel-2)}
.f-body{flex:1;min-width:0}
.f-name{font-size:13px;font-weight:640;display:flex;align-items:center;gap:8px}
.f-meta{font-size:11.5px;color:var(--txt-3);font-family:var(--mono)}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-dot.on{background:var(--green);box-shadow:0 0 8px rgba(67,192,138,.6)}
.status-dot.off{background:var(--txt-3)}
.status-dot.game{background:var(--gold);box-shadow:0 0 8px rgba(216,180,92,.6)}

/* ============================================================
   ANALYSIS
   ============================================================ */
.an-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media(max-width:1080px){.an-layout{grid-template-columns:1fr}}
.an-board-wrap{display:flex;gap:12px;align-items:stretch;justify-content:center}
.evalbar{
  width:15px;border-radius:8px;background:#171b22;overflow:hidden;
  position:relative;flex-shrink:0;border:1px solid var(--line);
  align-self:stretch;
}
.evalbar-fill{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,#f2f4f8,#c9cfd9);
  transition:height .35s cubic-bezier(.3,.9,.4,1);
}
.evalbar-label{
  position:absolute;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;font-weight:700;
  color:#0a0c12;z-index:2;
}
.evalbar-label.top{top:5px;color:#98a1af}
.evalbar-label.bot{bottom:5px}

.engine-panel{padding:14px}
.eng-line{
  display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;
}
.eng-line:last-child{border-bottom:0}
.eng-score{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--txt)}
.eng-score.pos{color:var(--txt)}
.eng-score.neg{color:var(--red)}
.eng-moves{
  font-family:var(--mono);font-size:11.5px;color:var(--txt-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.badge-inline{
  font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:4px;
  font-family:var(--mono);
}
.badge-inline.best{background:rgba(67,192,138,.14);color:var(--green)}
.badge-inline.good{background:rgba(123,140,255,.14);color:var(--accent)}
.badge-inline.inacc{background:rgba(216,180,92,.14);color:var(--gold)}
.badge-inline.blunder{background:rgba(224,87,106,.14);color:var(--red)}

/* ============================================================
   MODAL / OVERLAY
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(5,6,9,.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;place-items:center;padding:24px;
}
.overlay.show{display:grid;animation:ovIn .2s ease}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:380px;
  background:linear-gradient(170deg,#12161d,#0d1015);
  border:1px solid var(--line-2);
  border-radius:20px;padding:30px 26px;
  text-align:center;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95);
  animation:modIn .3s cubic-bezier(.2,.9,.3,1);
}
@keyframes modIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal h3{font-size:17px;font-weight:720;letter-spacing:-.02em;margin-bottom:6px}
.modal p{font-size:12.5px;color:var(--txt-3)}
.mm-ring{
  width:66px;height:66px;border-radius:50%;margin:0 auto 18px;
  border:2px solid var(--panel-3);border-top-color:var(--accent);
  animation:spin .9s linear infinite;position:relative;
}
.mm-ring::after{
  content:'';position:absolute;inset:9px;border-radius:50%;
  border:2px solid transparent;border-bottom-color:rgba(123,140,255,.45);
  animation:spin 1.5s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}
.mm-meta{
  display:flex;justify-content:center;gap:18px;margin:18px 0 22px;
  padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
}
.mm-meta .k{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-3)}
.mm-meta .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:3px}

.vs-block{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0}
.vs-block .vs-txt{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--txt-3)}

/* Result banner */
.result-banner{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:20;padding:18px 26px;border-radius:16px;text-align:center;
  background:rgba(10,12,16,.92);backdrop-filter:blur(14px);
  border:1px solid var(--line-2);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.95);
  animation:modIn .35s cubic-bezier(.2,.9,.3,1);
  min-width:200px;
}
.result-banner .res-t{font-size:19px;font-weight:780;letter-spacing:-.025em}
.result-banner .res-s{font-size:12px;color:var(--txt-3);margin-top:3px}
.result-banner .res-d{font-family:var(--mono);font-size:13px;font-weight:700;margin-top:9px}

/* ============================================================
   MOBILE NAV
   ============================================================ */
.mobile-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(10,12,16,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  justify-content:space-around;
}
.mn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 4px;border-radius:10px;color:var(--txt-3);
  font-size:9.5px;font-weight:600;letter-spacing:.01em;
  transition:color .16s;position:relative;
}
.mn-item svg{width:19px;height:19px}
.mn-item.active{color:var(--accent)}
.mn-item.active::before{
  content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:20px;height:2px;border-radius:0 0 2px 2px;background:var(--accent);
}

/* ============================================================
   VIEW ANIMATION
   ============================================================ */
.view{animation:viewIn .3s cubic-bezier(.22,.9,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.rail-stack{animation:viewIn .34s cubic-bezier(.22,.9,.3,1)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:1280px){
  .app{grid-template-columns:236px minmax(0,1fr)}
  .rail{display:none}
}
@media(max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100dvh}
  .sidebar{display:none}
  .main{padding:18px 16px 92px;overflow:visible}
  .mobile-nav{display:flex}
  .page-title{font-size:19px}
  .hero{padding:20px;flex-direction:column;align-items:stretch;gap:18px}
  .hero-right{padding-left:0;border-left:0;border-top:1px solid var(--line);padding-top:18px;justify-content:space-between}
  .hero-elo .val{font-size:30px}
  .hero-prog{width:auto;flex:1;max-width:200px}
  .board-shell{max-width:100%}
  .podium{grid-template-columns:1fr;gap:10px}
  .podium-card{flex-direction:row;text-align:left;gap:14px;padding:13px}
  .podium-card .avatar{width:44px;height:44px;font-size:15px}
  .prof-head{padding:18px;gap:16px}
  .prof-name{font-size:20px}
  .lb-table .hide-m{display:none}
  .hist-row{grid-template-columns:4px minmax(0,1fr) auto;gap:11px;padding:12px 12px}
  .hist-row .hist-avatar{display:none}
  .t-grid{grid-template-columns:1fr}
  .play-side{position:static}
  .movelist{max-height:200px}
  .modal{padding:24px 20px}
  .tabs{overflow-x:auto}
  .tab{white-space:nowrap}
  .mode-bar{gap:4px;padding:6px}
  .mode-chip{padding:6px 10px;font-size:12px}
  .mode-chip span.lbl-full{display:none}
}
@media(max-width:420px){
  .mode-bar .sep{display:none}
  .mode-chip span.lbl{display:none}
  .mode-chip{padding:8px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .tc-grid{grid-template-columns:repeat(2,1fr)}
}
.hidden{display:none !important}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
  <aside class="rail" id="rail"></aside>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="overlay" id="overlay"></div>

<script>
/* ============================================================
   ICONS
   ============================================================ */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.6 12 3l9 7.6"/><path d="M5.5 9.4V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.4"/><path d="M9.5 21v-6h5v6"/></svg>',

const FILES='abcdefgh';
const DIRS={
  n:[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]],
  b:[[1,1],[1,-1],[-1,1],[-1,-1]],
  r:[[1,0],[-1,0],[0,1],[0,-1]]
};
DIRS.q=[...DIRS.b,...DIRS.r];
DIRS.k=DIRS.q;

function algOf(i){return FILES[i&7]+(8-(i>>3))}
function idxOf(a){return (8-parseInt(a[1],10))*8+FILES.indexOf(a[0])}

const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

function parseFEN(fen){
  const [pos,turn,cast,ep]=fen.split(' ');
  const board=new Array(64).fill(null);
  let i=0;
  for(const ch of pos){
    if(ch==='/')continue;
    if(ch>='1'&&ch<='8'){i+=+ch;continue}
    board[i++]={t:ch.toLowerCase(),c:ch===ch.toUpperCase()?'w':'b'};
  }
  return {board,turn,cast,ep:ep==='-'?null:ep};
}
function cloneState(s){
  return {board:s.board.map(p=>p?{t:p.t,c:p.c}:null),turn:s.turn,cast:s.cast,ep:s.ep};
}
function attacked(b,idx,by){
  const f=idx&7, r=idx>>3;
  const pd = by==='w' ? 1 : -1;
  for(const df of [-1,1]){
    const tf=f+df, tr=r+pd;
    if(tf>=0&&tf<8&&tr>=0&&tr<8){
      const p=b[tr*8+tf];
      if(p&&p.c===by&&p.t==='p')return true;
    }
  }
  for(const [df,dr] of DIRS.n){
    const tf=f+df,tr=r+dr;
    if(tf<0||tf>7||tr<0||tr>7)continue;
    const p=b[tr*8+tf];
    if(p&&p.c===by&&p.t==='n')return true;
  }
  for(const [df,dr] of DIRS.b){
    let tf=f+df,tr=r+dr;
    while(tf>=0&&tf<8&&tr>=0&&tr<8){
      const p=b[tr*8+tf];
      if(p){ if(p.c===by&&(p.t==='b'||p.t==='q'))return true; break; }
      tf+=df;tr+=dr;
    }
  }
  for(const [df,dr] of DIRS.r){
    let tf=f+df,tr=r+dr;
    while(tf>=0&&tf<8&&tr>=0&&tr<8){
      const p=b[tr*8+tf];
      if(p){ if(p.c===by&&(p.t==='r'||p.t==='q'))return true; break; }
      tf+=df;tr+=dr;
    }
  }
  for(const [df,dr] of DIRS.k){
    const tf=f+df,tr=r+dr;
    if(tf<0||tf>7||tr<0||tr>7)continue;
    const p=b[tr*8+tf];
    if(p&&p.c===by&&p.t==='k')return true;
  }
  return false;
}
function inCheck(b,color){
  const k=b.findIndex(p=>p&&p.t==='k'&&p.c===color);
  if(k<0)return false;
  return attacked(b,k,color==='w'?'b':'w');
}
function genPseudo(s,color){
  const b=s.board, out=[];
  const opp=color==='w'?'b':'w';
  const push=(from,to,extra)=>{
    const m={from,to,piece:b[from].t,cap:b[to]?b[to].t:null};
    if(extra)Object.assign(m,extra);
    out.push(m);
  };
  for(let i=0;i<64;i++){
    const p=b[i];
    if(!p||p.c!==color)continue;
    const f=i&7, r=i>>3;
    if(p.t==='p'){
      const d=color==='w'?-1:1, start=color==='w'?6:1, promo=color==='w'?0:7;
      const r1=r+d;
      if(r1>=0&&r1<8&&!b[r1*8+f]){
        push(i,r1*8+f,{promo:r1===promo});
        const r2=r+2*d;
        if(r===start&&!b[r2*8+f])push(i,r2*8+f,{dbl:true});
      }
      for(const df of [-1,1]){
        const tf=f+df;
        if(tf<0||tf>7||r1<0||r1>7)continue;
        const t=r1*8+tf, tp=b[t];
        if(tp&&tp.c!==color)push(i,t,{promo:r1===promo});
        else if(!tp&&s.ep===algOf(t))push(i,t,{ep:true});
      }
    } else if(p.t==='n'){
      for(const [df,dr] of DIRS.n){
        const tf=f+df,tr=r+dr;
        if(tf<0||tf>7||tr<0||tr>7)continue;
        const t=tr*8+tf,tp=b[t];
        if(tp&&tp.c===color)continue;
        push(i,t);
      }
    } else if(p.t==='k'){
      for(const [df,dr] of DIRS.k){
        const tf=f+df,tr=r+dr;
        if(tf<0||tf>7||tr<0||tr>7)continue;
        const t=tr*8+tf,tp=b[t];
        if(tp&&tp.c===color)continue;
        push(i,t);
      }
      const homeR=color==='w'?7:0;
      if(r===homeR&&f===4&&!attacked(b,homeR*8+4,opp)){
        const ks=color==='w'?'K':'k', qs=color==='w'?'Q':'q';
        const rk=b[homeR*8+7];
        if(s.cast.includes(ks)&&rk&&rk.t==='r'&&rk.c===color
          &&!b[homeR*8+5]&&!b[homeR*8+6]
          &&!attacked(b,homeR*8+5,opp)&&!attacked(b,homeR*8+6,opp)){
          push(i,homeR*8+6,{castle:'k'});
        }
        const rq=b[homeR*8];
        if(s.cast.includes(qs)&&rq&&rq.t==='r'&&rq.c===color
          &&!b[homeR*8+1]&&!b[homeR*8+2]&&!b[homeR*8+3]
          &&!attacked(b,homeR*8+3,opp)&&!attacked(b,homeR*8+2,opp)){
          push(i,homeR*8+2,{castle:'q'});
        }
      }
    } else {
      const dirs = p.t==='b'?DIRS.b : p.t==='r'?DIRS.r : DIRS.q;
      for(const [df,dr] of dirs){
        let tf=f+df,tr=r+dr;
        while(tf>=0&&tf<8&&tr>=0&&tr<8){
          const t=tr*8+tf,tp=b[t];
          if(tp&&tp.c===color)break;
          push(i,t);
          if(tp)break;
          tf+=df;tr+=dr;
        }
      }
    }
  }
  return out;
}
function applyMove(s,m){
  const n=cloneState(s);
  const b=n.board;
  const p=b[m.from];
  b[m.to]=p; b[m.from]=null;
  if(m.ep){ const capSq=m.to+(p.c==='w'?8:-8); b[capSq]=null; }
  if(m.promo)b[m.to]={t:'q',c:p.c};
  if(m.castle==='k'){ const r=m.to+1; b[m.to-1]=b[r]; b[r]=null; }
  if(m.castle==='q'){ const r=m.to-2; b[m.to+1]=b[r]; b[r]=null; }
  let c=n.cast;
  if(p.t==='k') c = c.replace(p.c==='w'?/[KQ]/g:/[kq]/g,'');
  if(p.t==='r'||m.cap==='r'){
    const sq = p.t==='r' ? m.from : m.to;
    if(sq===63)c=c.replace('K','');
    if(sq===56)c=c.replace('Q','');
    if(sq===7)c=c.replace('k','');
    if(sq===0)c=c.replace('q','');
  }
  n.cast=c;
  n.ep = m.dbl ? algOf((m.from+m.to)/2) : null;
  n.turn = s.turn==='w'?'b':'w';
  return n;
}
function legalMoves(s,color){
  color=color||s.turn;
  const res=[];
  for(const m of genPseudo(s,color)){
    const n=applyMove(s,m);
    if(!inCheck(n.board,color))res.push(m);
  }
  return res;
}
function toSAN(s,m,legal){
  const p=s.board[m.from];
  if(m.castle==='k')return 'O-O';
  if(m.castle==='q')return 'O-O-O';
  let san='';
  if(p.t==='p'){
    if(m.cap)san+=FILES[m.from&7]+'x';
    san+=algOf(m.to);
    if(m.promo)san+='=Q';
  } else {
    san+=p.t.toUpperCase();
    const same=legal.filter(x=>x.to===m.to&&x.from!==m.from&&s.board[x.from]&&s.board[x.from].t===p.t&&s.board[x.from].c===p.c);
    if(same.length){
      const sameFile=same.some(x=>(x.from&7)===(m.from&7));
      const sameRank=same.some(x=>(x.from>>3)===(m.from>>3));
      if(!sameFile)san+=FILES[m.from&7];
      else if(!sameRank)san+=String(8-(m.from>>3));
      else san+=algOf(m.from);
    }
    if(m.cap)san+='x';
    san+=algOf(m.to);
  }
  const after=applyMove(s,m);
  if(inCheck(after.board,after.turn)){
    san += legalMoves(after,after.turn).length ? '+' : '#';
  }
  return san;
}

/* -------- engine eval -------- */
const VAL={p:100,n:320,b:330,r:500,q:900,k:0};
const PAWN_POS=new Array(64).fill(0);
function evalFor(b,color){
  let s=0;
  for(let i=0;i<64;i++){
    const p=b[i];
    if(!p)continue;
    let v=VAL[p.t];
    if(p.t==='p'){
      const adv = p.c==='w' ? (6-(i>>3)) : ((i>>3)-1);
      v += adv*6;
      const f=i&7;
      v += (f>=2&&f<=5)?8:0;
    }
    if(p.t==='n'||p.t==='b'){
      const f=i&7, r=i>>3;
      v += (f>=2&&f<=5&&r>=2&&r<=5)?12:0;
    }
    s += (p.c===color?1:-1)*v;
  }
  return s;
}
function search(s,depth,alpha,beta){
  const moves=legalMoves(s,s.turn);
  if(!moves.length){
    if(inCheck(s.board,s.turn))return -(100000-depth);
    return 0;
  }
  if(depth<=0)return evalFor(s.board,s.turn);
  moves.sort((a,b)=>(b.cap?VAL[b.cap]:0)-(a.cap?VAL[a.cap]:0));
  let best=-Infinity;
  for(const m of moves){
    const v=-search(applyMove(s,m),depth-1,-beta,-alpha);
    if(v>best)best=v;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function bestMove(s,depth){
  const moves=legalMoves(s,s.turn);
  if(!moves.length)return null;
  moves.sort((a,b)=>(b.cap?VAL[b.cap]:0)-(a.cap?VAL[a.cap]:0));
  let scored=[],best=-Infinity;
  for(const m of moves){
    const v=-search(applyMove(s,m),depth-1,-Infinity,Infinity);
    scored.push({m,v});
    if(v>best)best=v;
  }
  const pool=scored.filter(x=>x.v>=best-25);
  return pool[Math.floor(Math.random()*pool.length)].m;
}

const Game={
  st:parseFEN(START_FEN),
  active:false, over:false, mode:'ranked', minutes:10,
  clocks:{w:600,b:600}, last:null, selected:null, legal:[],
  sans:[], sanMoves:[], orientation:'w', opp:null, ai:false,
  timer:null, result:null, oppHue:null
};

Game.reset=function(minutes){
  this.st=parseFEN(START_FEN);
  this.over=false; this.result=null;
  this.clocks={w:minutes*60,b:minutes*60};
  this.last=null; this.selected=null;
  this.sans=[]; this.sanMoves=[];
  this.legal=[];
  this.orientation='w';
};
Game.startTimer=function(){
  clearInterval(this.timer);
  this.timer=setInterval(()=>{
    if(!this.active||this.over)return;
    const t=this.st.turn;
    this.clocks[t]-=0.25;
    if(this.clocks[t]<=0){
      this.clocks[t]=0;
      this.endGame(t==='w'?'loss':'win','Süre bitti');
      return;
    }
    paintClocks();
  },250);
};
Game.endGame=function(outcome,reason){
  if(this.over)return;
  this.over=true;
  this.result={outcome,reason};
  clearInterval(this.timer);
  paintBoard(); paintSide(); paintClocks();
};
Game.legalFor=function(){
  return legalMoves(this.st,this.st.turn);
};
Game.humanTurn=function(){
  if(!this.active||this.over)return false;
  if(this.ai&&this.st.turn==='b')return false;
  return true;
};
Game.doMove=function(m){
  const legal=this.legalFor();
  const san=toSAN(this.st,m,legal);
  this.st=applyMove(this.st,m);
  this.sans.push(san);
  this.sanMoves.push({san,m,fen:this.st});
  this.last={from:m.from,to:m.to};
  this.selected=null;
  this.legal=[];

  const opp=this.st.turn;
  if(inCheck(this.st.board,opp)){
    const lm=legalMoves(this.st,opp);
    if(!lm.length){
      const winner=opp==='w'?'b':'w';
      this.endGame(winner==='w'?'win':'loss','Şah mat');
      return;
    }
  } else if(!legalMoves(this.st,opp).length){
    this.endGame('draw','Pat');
    return;
  }
  paintBoard(); paintMoves(); paintSide(); paintClocks();

  if(this.ai&&this.st.turn==='b'&&!this.over){
    setTimeout(()=>{
      if(this.over)return;
      const m2=bestMove(this.st,2);
      if(m2)this.doMove(m2);
    },520);
  }
};
Game.onSquare=function(i){
  if(!this.humanTurn())return;
  const b=this.st.board;
  const p=b[i];
  if(this.selected!==null){
    const mvs=this.legal.filter(m=>m.from===this.selected&&m.to===i);
    if(mvs.length){
      let m=mvs[0];
      if(m.promo)m=mvs.find(x=>x.promo)||m;
      this.doMove(m);
      return;
    }
  }
  if(p&&p.c===this.st.turn){
    this.selected=i;
    this.legal=this.legalFor();
    paintBoard();
  } else {
    this.selected=null; this.legal=[];
    paintBoard();
  }
};
Game.surrender=function(){
  if(!this.active||this.over)return;
  this.endGame('loss','Terk');
};
Game.drawOffer=function(){
  if(!this.active||this.over)return;
  this.endGame('draw','Berabere anlaşması');
};

   BOARD PAINTING
   ============================================================ */
function paintBoard(){
  const el=$('#board');
  if(!el)return;
  const st=Game.st;
  const orient=Game.orientation;
  const files = orient==='w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
  const ranks = orient==='w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
  const checkColor = Game.active && !Game.over ? st.turn : null;
  let checkSq=-1;
  if(checkColor && inCheck(st.board,checkColor)){
    checkSq=st.board.findIndex(p=>p&&p.t==='k'&&p.c===checkColor);
  }
  const targets=new Set();
  if(Game.selected!==null)Game.legal.filter(m=>m.from===Game.selected).forEach(m=>targets.add(m.to));

  let html='';
  for(const r of ranks){
    for(const f of files){
      const i=r*8+f;
      const light=(r+f)%2===0;
      let cls='sq '+(light?'light':'dark');
      if(Game.last&&(i===Game.last.from||i===Game.last.to))cls+=' last';
      if(i===Game.selected)cls+=' sel';
      if(i===checkSq)cls+=' check';
      if(Game.humanTurn())cls+=' clickable';
      let inner='';
      if(f===(orient==='w'?0:7))inner+=`<span class="coord rank">${8-r}</span>`;
      if(r===(orient==='w'?7:0))inner+=`<span class="coord file">${FILES[f]}</span>`;
      const p=st.board[i];
      if(targets.has(i)){
        inner += p ? '<span class="dot cap"></span>' : '<span class="dot"></span>';
      }
      if(p)inner+=pieceSVG(p.t,p.c);
      html+=`<div class="${cls}" data-sq="${i}">${inner}</div>`;
    }
  }
  el.innerHTML=html;
  if(Game.over&&Game.result){
    const rb=document.createElement('div');
    rb.className='result-banner';
    const map={win:'Kazandın',loss:'Kaybettin',draw:'Berabere'};
    const col={win:'var(--green)',loss:'var(--red)',draw:'var(--txt-2)'};
    rb.innerHTML=`<div class="res-t" style="color:${col[Game.result.outcome]}">${map[Game.result.outcome]}</div>
      <div class="res-s">${Game.result.reason}</div>
      <div class="res-d">${Game.sans.length} hamle</div>`;
    el.parentElement.appendChild(rb);
  } else {
    const old=$('.result-banner');
    if(old)old.remove();
  }
}
function paintClocks(){
  const wt=$('#clock-w'), bt=$('#clock-b');
  if(!wt||!bt)return;
  wt.textContent=fmtTime(Game.clocks.w);
  bt.textContent=fmtTime(Game.clocks.b);
  const turn=Game.active&&!Game.over?Game.st.turn:null;
  wt.classList.toggle('active',turn==='w');
  bt.classList.toggle('active',turn==='b');
  wt.classList.toggle('low',Game.clocks.w<=30);
  bt.classList.toggle('low',Game.clocks.b<=30);
}
function paintMoves(){
  const el=$('#movelist');
  if(!el)return;
  if(!Game.sans.length){
    el.innerHTML='<div style="padding:16px 8px;font-size:12px;color:var(--txt-3);text-align:center">Henüz hamle yok</div>';
    return;
  }
  let html='';
  for(let i=0;i<Game.sans.length;i+=2){
    const n=(i/2)+1;
    html+=`<div class="mv-row"><span class="mn">${n}</span>
      <span class="mv-cell">${Game.sans[i]||''}</span>
      <span class="mv-cell${Game.sans[i+1]?'':' empty'}">${Game.sans[i+1]||'—'}</span></div>`;
  }
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

/* ---------- ANALYSIS ---------- */
const Analysis={
  moves:[], idx:0, states:[], evals:[], base:null
};
Analysis.build=function(){
  let s=parseFEN(START_FEN);
  const states=[s];
  const moves=[];
  for(const [a,b] of OPERA){
    const legal=legalMoves(s,s.turn);
    const from=idxOf(a), to=idxOf(b);
    const m=legal.find(x=>x.from===from&&x.to===to);
    if(!m)break;
    const san=toSAN(s,m,legal);
    s=applyMove(s,m);
    states.push(s);
    moves.push({san,m});
  }
  this.states=states;
  this.moves=moves;
  this.idx=moves.length;
  this.evals=states.map((st,i)=>{
    if(i===0)return 20;
    const cp=evalFor(st.board,'w');
    return cp;
  });
};
Analysis.setIdx=function(i){
  this.idx=Math.max(0,Math.min(this.moves.length,i));
  paintAnalysis();
};
Analysis.scoreText=function(cp){
  if(Math.abs(cp)>90000){
    return cp>0?'+M':'−M';
  }
  return (cp>0?'+':'')+(cp/100).toFixed(2);
};

function paintAnalysis(){
  const el=$('#board');
  if(!el)return;
  const st=Analysis.states[Analysis.idx];
  const prev=Analysis.idx>0?Analysis.moves[Analysis.idx-1].m:null;
  const checkSq = inCheck(st.board,st.turn)?st.board.findIndex(p=>p&&p.t==='k'&&p.c===st.turn):-1;
  let html='';
  for(let r=0;r<8;r++){
    for(let f=0;f<8;f++){
      const i=r*8+f;
      const light=(r+f)%2===0;
      let cls='sq '+(light?'light':'dark');
      if(prev&&(i===prev.from||i===prev.to))cls+=' last';
      if(i===checkSq)cls+=' check';
      let inner='';
      if(f===0)inner+=`<span class="coord rank">${8-r}</span>`;
      if(r===7)inner+=`<span class="coord file">${FILES[f]}</span>`;
      const p=st.board[i];
      if(p)inner+=pieceSVG(p.t,p.c);
      html+=`<div class="${cls}">${inner}</div>`;
    }
  }
  el.innerHTML=html;

  const cp=Analysis.evals[Analysis.idx]||0;
  const pct=100/(1+Math.exp(-cp/320));
  const fill=$('#evalFill');
  if(fill)fill.style.height=pct+'%';
  const txt=Analysis.scoreText(cp);
  const top=$('#evalTop'), bot=$('#evalBot');
  if(top)top.textContent=cp<0?txt:'';
  if(bot)bot.textContent=cp>=0?txt:'';

  const mv=$('#anMoves');
  if(mv){
    let h='';
    for(let i=0;i<Analysis.moves.length;i+=2){
      const n=(i/2)+1;
      const w=Analysis.moves[i];
      const b=Analysis.moves[i+1];
      h+=`<div class="mv-row"><span class="mn">${n}</span>
        <span class="mv-cell${Analysis.idx===i+1?' cur':''}" data-anmv="${i+1}">${w.san}</span>
        <span class="mv-cell${b?(Analysis.idx===i+2?' cur':''):' empty'}" ${b?`data-anmv="${i+2}"`:''}>${b?b.san:'—'}</span></div>`;
    }
    mv.innerHTML=h;
  }
  const c=$('#anCounter');
  if(c)c.textContent=`${Analysis.idx} / ${Analysis.moves.length}`;
}

  Game.opp={name:opp.n,elo:opp.e};
  ov.innerHTML=`<div class="modal">
    <div class="pill green" style="margin:0 auto 16px">RAKİP BULUNDU</div>
    <div class="vs-block">
      <div style="text-align:center">

      </div>
      <div class="vs-txt">VS</div>

        ${avatarHTML(opp.n,'l')}
        <div style="font-size:13px;font-weight:650;margin-top:8px">${opp.n}</div>
        <div style="font-size:11px;color:var(--txt-3);font-family:var(--mono)">${opp.e}</div>
      </div>
    </div>
    <div class="mm-meta" style="margin-bottom:0">
      <div><div class="k">Süre</div><div class="v">${Game.minutes}+0</div></div>
      <div><div class="k">Renk</div><div class="v">Beyaz</div></div>

    App.render();
  },1400);
}

/* ============================================================
   APP
   ============================================================ */
const App={
  view:'home',
  go(v){
    if(v===this.view)return;
    this.view=v;
    document.querySelector('.main').scrollTop=0;
    this.render();
  },
  render(){
    const main=$('#main');
    main.innerHTML=Views[this.view]?Views[this.view]():Views.home();

    // rail
    const railMap={
      home:()=>railLive()+railTop5(),
      play:()=>railGameInfo(),
      tournaments:()=>railTournament(),
      leaderboard:()=>railRank(),
      history:()=>railPerf(),
      friends:()=>railFriends(),
      profile:()=>railProfile(),
      analysis:()=>railEngine()
    };
    $('#rail').innerHTML=`<div class="rail-stack">${(railMap[this.view]||railMap.home)()}</div>`;

    // play rail inside play layout
    if(this.view==='play'){
      const pr=$('#playRail');
      if(pr)pr.innerHTML=railGameInfo();
    }

    // nav states
    $$('[data-nav]').forEach(b=>{
      b.classList.toggle('active',b.dataset.nav===this.view);
    });

    // post render
    if(this.view==='play'){
      paintBoard(); paintMoves(); paintClocks(); bindPlay();
    }
    if(this.view==='analysis'){
      if(!Analysis.moves.length)Analysis.build();
      paintAnalysis();
      bindAnalysis();
    }
  }
};

/* ============================================================
   BINDINGS
   ============================================================ */
function bindPlay(){
  const board=$('#board');
  if(board){
    board.addEventListener('click',e=>{
      const sq=e.target.closest('.sq');
      if(!sq||sq.dataset.sq===undefined)return;
      Game.onSquare(+sq.dataset.sq);
    });
  }
  const fb=$('#flipBtn'), fb2=$('#flipBtn2');
  const flip=()=>{Game.orientation=Game.orientation==='w'?'b':'w';paintBoard()};
  if(fb)fb.onclick=flip;
  if(fb2)fb2.onclick=flip;

  const sb=$('#surrenderBtn');
  if(sb)sb.onclick=()=>{Game.surrender();};
  const db=$('#drawBtn');
  if(db)db.onclick=()=>{Game.drawOffer();};
  const fmb=$('#findMatchBtn');
  if(fmb)fmb.onclick=()=>{
    if(Game.mode==='ai'){
      Game.opp={name:'Zato Engine',elo:2050};
      Game.ai=true;
      Game.reset(Game.minutes);
      Game.active=true;
      Game.startTimer();
      App.render();
    } else {
      Game.ai=false;
      showMatchmaking();
    }
  };
}

function bindAnalysis(){
  const go=i=>{Analysis.setIdx(i)};
  const bind=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  bind('#anPrev',()=>go(Analysis.idx-1));
  bind('#anPrev2',()=>go(Analysis.idx-1));
  bind('#anNext',()=>go(Analysis.idx+1));
  bind('#anNext2',()=>go(Analysis.idx+1));
  bind('#anStart',()=>go(0));
  bind('#anEnd',()=>go(Analysis.moves.length));
  const mv=$('#anMoves');
  if(mv){
    mv.onclick=e=>{
      const c=e.target.closest('[data-anmv]');
      if(c)go(+c.dataset.anmv);
    };
  }
  const kb=e=>{
    if(App.view!=='analysis')return;
    if(e.key==='ArrowLeft')go(Analysis.idx-1);
    if(e.key==='ArrowRight')go(Analysis.idx+1);
  };
  document.onkeydown=kb;
}

/* Global delegation */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){App.go(nav.dataset.nav);return}
  const go=e.target.closest('[data-go]');
  if(go){App.go(go.dataset.go);return}
  const mode=e.target.closest('[data-mode]');
  if(mode){
    Game.mode=mode.dataset.mode;
    $$('[data-mode]').forEach(m=>m.classList.toggle('active',m===mode));
    return;
  }
  const min=e.target.closest('[data-min]');
  if(min){
    Game.minutes=+min.dataset.min;
    $$('[data-min]').forEach(m=>m.classList.toggle('active',m===min));
    return;
  }
  const quick=e.target.closest('[data-quick]');
  if(quick){
    Game.minutes=+quick.dataset.quick;
    $$('[data-quick]').forEach(m=>m.classList.toggle('active',m===quick));
    App.go('play');
    return;
  }
  const chip=e.target.closest('.chip');
  if(chip){
    const p=chip.parentElement;
    $$('.chip',p).forEach(c=>c.classList.toggle('active',c===chip));
    return;
  }
  const tab=e.target.closest('.tab');
  if(tab){
    const p=tab.parentElement;
    $$('.tab',p).forEach(t=>t.classList.toggle('active',t===tab));
    return;
  }
});
