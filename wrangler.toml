name = "zato-chess"
main = "worker/index.ts"
compatibility_date = "2026-10-07"

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "zato-chess"
database_id = "3bc201ad-5257-4c1d-9454-17431f48dcc2"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "SocialDurableObject"

[[durable_objects.bindings]]
name = "MATCHMAKING"
class_name = "MatchmakingDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SocialDurableObject"]

# V28 push subscriptions use a D1 schema migration; apply db/schema.sql to the configured database.

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MatchmakingDurableObject"]

[triggers]
crons = ["*/5 * * * *"]
